<!DOCTYPE html>
<html>
<head>
    <title>VetCareAI - Login</title>
</head>
<body>
    <h1>VetCareAI</h1>
    <h2>Login</h2>
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
    <form method = "POST">
        {% csrf_token %}
        <label>Username:</label>
        <input type = "text" name = "username" required>
        <br><br>
        <label>Password:</label>
        <input type = "password" name = "password" required>
        <br><br>
        <button type = "submit">
            Login
        </button>
    </form>
    <br>
    <a href = "{% url 'register' %}">
        Don't have an account? register
    </a>
</body>
</html>
